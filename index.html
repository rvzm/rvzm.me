<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top border-bottom site-nav">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand" href="#/home">
        <span class="brand-mark">~</span> rvzm
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="navList"></ul>

        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary" id="themeToggle" type="button" title="Switch theme">
            <i class="bi bi-circle-half"></i>
          </button>
          <button class="btn btn-sm btn-outline-secondary d-lg-none" type="button"
                  data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
            <i class="bi bi-github"></i> Repos
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-lg-4">
    <div class="row g-4 py-4">

      <!-- Content region: swapped by the router -->
      <main class="col-12 col-lg-8 col-xl-9">
        <div id="content" aria-live="polite">
          <div class="placeholder-glow">
            <span class="placeholder col-4"></span>
            <span class="placeholder col-12"></span>
            <span class="placeholder col-10"></span>
          </div>
        </div>
      </main>

      <!-- Sidebar: desktop -->
      <aside class="col-lg-4 col-xl-3 d-none d-lg-block">
        <div class="sidebar-sticky">
          <div class="d-flex align-items-baseline justify-content-between mb-3">
            <h2 class="sidebar-heading mb-0">Repo activity</h2>
            <button class="btn btn-sm btn-link p-0 refresh-repos" type="button">Refresh</button>
          </div>
          <div id="repoCards" class="d-grid gap-3 repo-activity-mount"></div>
          <p class="sidebar-note mt-3 mb-0" id="rateNote"></p>
        </div>
      </aside>

    </div>
  </div>

  <!-- Sidebar: mobile -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="sidebarOffcanvas">
    <div class="offcanvas-header">
      <h2 class="offcanvas-title sidebar-heading">Repo activity</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div id="repoCardsMobile" class="d-grid gap-3 repo-activity-mount"></div>
    </div>
  </div>

  <footer class="border-top mt-5 py-4">
    <div class="container-fluid px-lg-4 d-flex flex-wrap gap-3 justify-content-between site-footer">
      <span>Built on Bootstrap 5. Served from kelvin.</span>
      <span id="footerYear"></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
